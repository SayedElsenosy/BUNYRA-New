name: Validate BUNYRA
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  cloudflare-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WRANGLER_SEND_METRICS: 'false'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:word-templates
      - run: npm run test:enterprise-security
      - run: npm run test:enterprise-db
      - run: npm run test:fixture-guard
      - run: npm run test:ledger-core
      - run: npm run test:finance-events
      - run: npm run test:payables-core
      - run: npm run test:treasury-core
      - run: npm run test:ledger-controls
      - run: npm run test:project-budgets
      - run: npm run test:supplier-payments
      - run: npm run test:fixed-assets
      - run: node --check scripts/run-fixed-assets-integration-tests.mjs
      - run: node --check scripts/run-supplier-payments-integration-tests.mjs
      - run: node --check scripts/run-supplier-reversal-integration-tests.mjs
      - run: node --check scripts/run-supplier-credit-integration-tests.mjs
      - run: node --check scripts/run-supplier-credit-correction-tests.mjs
      - run: node --check scripts/run-vendor-statement-tests.mjs
      - run: node --check scripts/run-vendor-aging-tests.mjs
      - run: node --check scripts/run-customer-accounts-tests.mjs
      - run: node --check scripts/run-project-budgets-integration-tests.mjs
      - run: node --check scripts/run-finance-outbox-integration-tests.mjs
      - run: node --check scripts/run-finance-outbox-concurrency-tests.mjs
      - run: node --check scripts/run-payment-account-integration-tests.mjs
      - run: node --check hosting/finance-scheduler.mjs
      - run: npm run test:tenant-client
      - run: node scripts/test-workspace-inventory-merge.mjs
      - run: node scripts/test-phase2-operational-merge.mjs
      - run: node scripts/test-phase3-treasury.mjs
      - run: npm run test:record-scopes
      - run: npm run test:navigation
      - run: npm run test:report-dates
      - run: npm run test:report-csv
      - run: npm run test:feature-gates
      - run: npm run typecheck
      - run: npm run build:cloudflare
      - run: npx wrangler deploy --dry-run --outdir .sites-runtime/worker-check

  deploy-cloudflare:
    name: Deploy BUNYRA after validation
    needs: cloudflare-build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEXT_TELEMETRY_DISABLED: '1'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Check deploy credentials without exposing them
        id: enabled
        shell: bash
        run: |
          if [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cloudflare deployment skipped: GitHub Actions needs CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets."
          fi
      - uses: actions/checkout@v4
        if: steps.enabled.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.enabled.outputs.ready == 'true'
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        if: steps.enabled.outputs.ready == 'true'
        run: npm ci --ignore-scripts
      - name: Build release bundle
        if: steps.enabled.outputs.ready == 'true'
        run: npm run build:cloudflare
      - name: Deploy the validated main commit
        if: steps.enabled.outputs.ready == 'true'
        run: npm run deploy:cloudflare
