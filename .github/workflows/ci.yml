name: Validate BUNYRA
on:
  push:
permissions:
  contents: read
jobs:
  cloudflare-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WRANGLER_SEND_METRICS: 'false'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:tenant-client
      - run: npm run test:navigation
      - run: npm run test:report-dates
      - run: npm run test:report-csv
      - run: npm run test:feature-gates
      - run: npm run typecheck
      - run: npm run build:cloudflare
