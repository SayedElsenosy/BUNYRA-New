name: BUNYRA Neon Integration (isolated)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bunyra-neon-fixture-integration
  cancel-in-progress: false
jobs:
  database-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      BUNYRA_TEST_DATABASE_URL: ${{ secrets.BUNYRA_TEST_DATABASE_URL }}
      BUNYRA_ALLOW_TEST_FIXTURES: '1'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Verify isolated Neon fixture database before any writes
        run: node --input-type=module -e "import {assertFixtureDatabaseTarget} from './scripts/test-fixture-guard.mjs'; await assertFixtureDatabaseTarget(); console.log('Safe fixture branch verified')"
      - name: Bank statement reconciliation and closing
        run: npm run -s test:treasury-integration
      - name: Supplier bills and payable ledger integration
        run: npm run -s test:payables-integration
      - name: Fixed asset depreciation, close controls and tenant isolation
        run: npm run -s test:fixed-assets-integration
      - name: Supplier partial payments, supplier balances and rollback
        run: npm run -s test:supplier-payments-integration
      - name: Supplier payment corrections, bank matching race and closed periods
        run: npm run -s test:supplier-reversals-integration
      - name: Budget approval, immutable revisions and rollback
        run: npm run -s test:project-budgets-integration
      - name: General ledger double-entry, immutability and RLS
        run: npm run -s test:ledger-integration
      - name: Accounting setup, immediate posting, retry queue and concurrent processors
        run: npm run -s test:finance-outbox-integration
      - name: Per-receipt bank choice, foreign currency snapshots and native bank reconciliation
        run: npm run -s test:payment-accounts-integration
      - name: Database row-level tenant isolation
        run: npm run -s test:tenancy
      - name: Receipts, adjustments and finance
        run: npm run -s test:finance
      - name: Booking, contract, pricing and concurrent adjustment integrity
        run: npm run -s test:commercial-integrity
      - name: Commission ledger, reports and boundaries
        run: npm run -s test:commissions-reports
